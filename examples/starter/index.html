<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Your next great edit</title>
<!-- Starter composition. `npm run new-video -- <slug> --format 9:16|16:9|1:1|4:5`
     replaces __W__, __H__, __U__ (1% of the short side, px) and __LAYOUT__. -->
<script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:__W__px;height:__H__px;overflow:hidden;background:#080c12;color:#f0f3f7;font-family:Inter,sans-serif}
#starter{position:relative;width:__W__px;height:__H__px;overflow:hidden;background:radial-gradient(ellipse at 80% 10%,#1c2a25,transparent 65%);--u:__U__px}
.grid{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(#45604a 1px,transparent 1px),linear-gradient(90deg,#45604a 1px,transparent 1px);background-size:calc(var(--u)*7.4) calc(var(--u)*7.4)}
.content{position:absolute;inset:0;padding:calc(var(--u)*9) calc(var(--u)*8);display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:600 calc(var(--u)*2.4) "JetBrains Mono",monospace;color:#b9f27c;letter-spacing:.2em}
h1{font-weight:800;font-size:calc(var(--u)*9.5);line-height:1.04;letter-spacing:-.03em;margin:calc(var(--u)*4) 0 calc(var(--u)*2.5)}
.sub{font-size:calc(var(--u)*3.2);color:#aeb8c3;margin:0}
.steps{display:flex;gap:calc(var(--u)*2.5);margin-top:calc(var(--u)*7)}
.portrait .steps{flex-direction:column}
.step{flex:1;padding:calc(var(--u)*3);border:1px solid #3a4a42;background:#111a1a;border-radius:calc(var(--u)*1.6)}
.num{color:#b9f27c;font:600 calc(var(--u)*2.6) "JetBrains Mono",monospace}
.step h2{font-size:calc(var(--u)*3.9);margin:calc(var(--u)*1.6) 0 calc(var(--u)*1)}
.step p{font-size:calc(var(--u)*2.3);line-height:1.5;color:#acb9b4;margin:0}
</style></head><body>
<div id="starter" class="__LAYOUT__" data-composition-id="starter" data-start="0" data-duration="8" data-width="__W__" data-height="__H__">
<div id="grid" class="grid clip" data-start="0" data-duration="8" data-track-index="0"></div>
<div id="content" class="content clip" data-start="0" data-duration="8" data-track-index="1">
<div class="eyebrow">HYPERFRAMES / FIRST COMPOSITION</div>
<h1>Your next great edit starts with a story.</h1><p class="sub">Bring your footage. Make every beat count.</p>
<div class="steps"><div class="step"><span class="num">01</span><h2>Find the story</h2><p>Keep the examples. Make the point clear.</p></div>
<div class="step"><span class="num">02</span><h2>Shape the edit</h2><p>Trim dead air. Keep natural rhythm.</p></div>
<div class="step"><span class="num">03</span><h2>Show the idea</h2><p>Move with purpose. Review every cut.</p></div></div></div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.from('.eyebrow',{opacity:0,y:12,duration:.55,ease:'power2.out'},0);
tl.from('h1',{opacity:0,y:35,duration:.8,ease:'power2.out'},.2);
tl.from('.sub',{opacity:0,y:14,duration:.6,ease:'power2.out'},.7);
tl.from('.step',{opacity:0,y:35,duration:.65,stagger:.5,ease:'power2.out'},1.3);
tl.to('.grid',{x:-18,y:-12,duration:8,ease:'none'},0);
window.__timelines=window.__timelines||{};window.__timelines['starter']=tl;
</script></body></html>
