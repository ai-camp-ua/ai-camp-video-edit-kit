<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><title>Перевірка українських літер</title>
<!-- Setup check: Bebas Neue and Plus Jakarta Sans have no Cyrillic, so Oswald and Inter
     draw the Ukrainian letters (rule in docs/FONTS.md). Every letter must look right. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald&family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@800&family=Montserrat:wght@800&display=block">
<script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b0f14}
#main{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#1d2a3a,#0b0f14 70%)}
.hook{position:absolute;left:70px;right:70px;top:300px;font-family:"Bebas Neue","Oswald",sans-serif;font-size:160px;line-height:.95;color:#fff;text-transform:uppercase}
.sub{position:absolute;left:70px;right:70px;top:700px;font-family:"Plus Jakarta Sans","Inter",sans-serif;font-weight:800;font-size:60px;color:#37BDF8}
.cap{position:absolute;left:90px;right:90px;bottom:420px;text-align:center;font-family:"Montserrat",sans-serif;font-weight:800;font-size:72px;color:#fff;background:rgba(0,0,0,.65);padding:18px 26px;border-radius:18px}
</style></head><body>
<div id="main" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
<div id="hook" class="hook clip" data-start="0" data-duration="3" data-track-index="0">Ґанок, їжак<br>і єнот</div>
<div id="sub" class="sub clip" data-start="0" data-duration="3" data-track-index="1">ҐЇЄІ ґїєі — Hook</div>
<div id="cap" class="cap clip" data-start="0" data-duration="3" data-track-index="2">Сьогодні я покажу, як змонтувати рілс</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
tl.from('#hook',{opacity:0,y:40,duration:.5,ease:'power2.out'},0);
tl.from('#sub,#cap',{opacity:0,duration:.4},.3);
window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
</script></body></html>
