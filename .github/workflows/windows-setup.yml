# Runs the SETUP.md Windows steps on a clean GitHub Windows machine, the way
# Claude Code does them (Git Bash). Started by hand: Actions → Windows setup test.
name: Windows setup test
on: workflow_dispatch

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      LANG_CODE: uk
    steps:
      - name: Step 0 · system check
        run: |
          cmd //c ver; echo "$PROCESSOR_ARCHITECTURE"; df -h "$HOME" | tail -1
          echo "RAM GB: $(powershell.exe -NoProfile -Command '[math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB)' | tr -d '\r')"
          for c in winget git node npm ffmpeg yt-dlp; do printf "%-8s " $c; command -v $c || echo "missing"; done

      - name: Step 1 · winget packages
        continue-on-error: true
        run: |
          winget install --accept-package-agreements --accept-source-agreements --disable-interactivity OpenJS.NodeJS.LTS Git.Git Gyan.FFmpeg yt-dlp.yt-dlp DenoLand.Deno Microsoft.VCRedist.2015+.x64
          echo "winget exit: $?"

      - name: Step 1 · PATH line and check
        run: |
          cat > ~/.ai-camp-path.sh <<'EOF'
          export PATH="$(cygpath -u -p "$(powershell.exe -NoProfile -Command '[Environment]::GetEnvironmentVariable("Path","User")+";"+[Environment]::GetEnvironmentVariable("Path","Machine")' | tr -d '\r')"):$PATH"
          EOF
          source ~/.ai-camp-path.sh
          for c in node git ffmpeg ffprobe yt-dlp deno; do printf "%-8s " $c; command -v $c || echo "MISSING"; done
          node -v; yt-dlp --version; ffmpeg -hide_banner -filters 2>/dev/null | grep -E " (subtitles|drawtext) "

      - name: Step 1 · whisper.cpp
        run: |
          W="$HOME/VideoEditing"; mkdir -p "$W"; cd "$W" && source ~/.ai-camp-path.sh
          U=$(curl -s "https://api.github.com/repos/ggml-org/whisper.cpp/releases?per_page=20" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{for(const r of JSON.parse(s))for(const a of r.assets)if(a.name==='whisper-bin-x64.zip'){console.log(a.browser_download_url);return}})")
          echo "URL: $U"
          curl -L --fail -o whisper.zip "$U" && powershell.exe -NoProfile -Command "Expand-Archive whisper.zip -DestinationPath whisper -Force" && rm whisper.zip
          ./whisper/Release/whisper-cli.exe --help 2>&1 | head -3

      - name: Step 2 · model
        run: |
          W="$HOME/VideoEditing"; cd "$W" && mkdir -p models
          RAM=$(powershell.exe -NoProfile -Command '[math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB)' | tr -d '\r')
          if [ "$RAM" -ge 16 ]; then M=ggml-large-v3-turbo.bin; else M=ggml-large-v3-turbo-q5_0.bin; fi
          curl -sS -L --fail -C - -o "models/$M" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$M" && ls -lh models

      - name: Step 3 · kit
        run: |
          W="$HOME/VideoEditing"; cd "$W"
          git init -q -b main
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch -q --depth 1 origin ${{ github.sha }}
          git checkout -q FETCH_HEAD
          printf 'CLAUDE.local.md\n' >> .git/info/exclude
          source ~/.ai-camp-path.sh
          npm ci && npm run setup -- --lang $LANG_CODE && npm test
          npx hyperframes doctor || true
          git status --short | head -5; echo "(git status above should be empty)"

      - name: Step 4 · HyperFrames skills
        run: |
          source ~/.ai-camp-path.sh
          cd "$HOME" && npx -y hyperframes@latest skills update hyperframes hyperframes-cli hyperframes-registry media-use && ls ~/.claude/skills

      - name: Step 6 · voices on this machine
        continue-on-error: true
        run: |
          powershell.exe -NoProfile -Command 'Add-Type -AssemblyName System.Speech; (New-Object System.Speech.Synthesis.SpeechSynthesizer).GetInstalledVoices() | % { $_.VoiceInfo.Name + " | " + $_.VoiceInfo.Culture + " | enabled=" + $_.Enabled }'

      - name: Step 6 · test clip, transcription, silence cut
        continue-on-error: true
        run: |
          W="$HOME/VideoEditing"; cd "$W" && source ~/.ai-camp-path.sh
          T=$(mktemp -d); echo "T=$T"; echo "$T" > ~/smoke-T
          node scripts/test-clip.mjs "$T" --lang $LANG_CODE || { echo "NO $LANG_CODE VOICE, using en"; node scripts/test-clip.mjs "$T" --lang en; echo en > ~/smoke-lang; }
          L=$(cat ~/smoke-lang 2>/dev/null || echo $LANG_CODE)
          npm run transcribe -- "$T/raw.mp4" --language $L && node -e "console.log(require(process.argv[1]).words.map(w=>w.text).join(' '))" "$T/raw.json"
          node .claude/skills/cut-silences/scripts/cut-silences.mjs "$T/raw.json" --video "$T/raw.mp4" --apply --output "$T/cut.mp4" > "$T/cut.log" 2>&1 \
            || { tail -20 "$T/cut.log"; echo "CUT FAILED"; }
          for f in raw cut; do printf "$f: "; ffprobe -v error -show_entries format=duration -of csv=p=0 "$T/$f.mp4"; done

      - name: Step 6 · FFmpeg subtitles
        continue-on-error: true
        run: |
          W="$HOME/VideoEditing"; cd "$W" && source ~/.ai-camp-path.sh; T=$(cat ~/smoke-T)
          printf '1\n00:00:00,000 --> 00:00:03,000\n%s\n' "$(node -e "import('./scripts/lib/lang.mjs').then(m=>console.log(m.sampleFor('$LANG_CODE')))")" > "$T/s.srt"
          cat "$T/s.srt"
          (cd "$T" && ffmpeg -y -loglevel error -i cut.mp4 -vf "subtitles=s.srt:force_style='FontSize=18'" -t 3 sub.mp4 && ffmpeg -y -loglevel error -ss 1 -i sub.mp4 -frames:v 1 sub.png) && ls -l "$T/sub.png"

      - name: Step 6 · yt-dlp
        continue-on-error: true
        run: |
          source ~/.ai-camp-path.sh
          yt-dlp --simulate --print "%(title)s | %(duration)ss" "https://www.youtube.com/watch?v=jNQXAC9IVRw"

      - name: Step 6 · fonts and HyperFrames frames
        continue-on-error: true
        run: |
          W="$HOME/VideoEditing"; cd "$W" && source ~/.ai-camp-path.sh
          npm run -s font-check -- "Bebas Neue" Montserrat
          npm run -s check-render -- --format 9:16
          npm run -s check-render -- --format 16:9
          npm run -s check-render -- --format 9:16 --lang en

      - name: Collect results
        if: always()
        run: |
          W="$HOME/VideoEditing"; OUT="$(cygpath -u "$GITHUB_WORKSPACE")/ci-out"; mkdir -p "$OUT"
          T=$(cat ~/smoke-T 2>/dev/null); [ -n "$T" ] && cp "$T"/sub.png "$T"/cut.log "$T"/raw.json "$OUT"/ 2>/dev/null
          for d in "$W"/video-projects/check-*; do [ -f "$d/renders/check.png" ] && cp "$d/renders/check.png" "$OUT/$(basename "$d").png"; done
          ls -l "$OUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-results
          path: ci-out
